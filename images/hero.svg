<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3c6e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2a5298" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="380" rx="20" fill="url(#bg)"/>

  <!-- Floating cards -->
  <!-- Card 1: Job match -->
  <rect x="30" y="50" width="200" height="110" rx="14" fill="white" filter="drop-shadow(0 4px 16px rgba(26,60,110,0.13))"/>
  <circle cx="62" cy="85" r="18" fill="#e8f0fe"/>
  <text x="62" y="91" text-anchor="middle" font-size="18" fill="#1a3c6e">💼</text>
  <rect x="88" y="74" width="110" height="9" rx="4" fill="#1a3c6e" opacity="0.85"/>
  <rect x="88" y="90" width="78" height="7" rx="3" fill="#6b7280" opacity="0.5"/>
  <rect x="32" y="115" width="196" height="1" fill="#e5e7eb"/>
  <rect x="32" y="126" width="60" height="22" rx="6" fill="#d4edda"/>
  <text x="62" y="141" text-anchor="middle" font-size="10" font-weight="600" fill="#155724">Active</text>
  <rect x="100" y="126" width="76" height="22" rx="6" fill="#e8f0fe"/>
  <text x="138" y="141" text-anchor="middle" font-size="10" font-weight="600" fill="#1a3c6e">Apply Now</text>

  <!-- Card 2: Profile completion -->
  <rect x="290" y="30" width="200" height="90" rx="14" fill="white" filter="drop-shadow(0 4px 16px rgba(26,60,110,0.13))"/>
  <text x="310" y="58" font-size="12" font-weight="600" fill="#1a3c6e">Profile Completion</text>
  <rect x="310" y="68" width="160" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="310" y="68" width="122" height="10" rx="5" fill="#1a3c6e"/>
  <text x="310" y="98" font-size="11" fill="#6b7280">76% complete</text>
  <text x="455" y="98" font-size="11" font-weight="700" fill="#1a3c6e" text-anchor="end">🎓</text>

  <!-- Card 3: Applications tracker -->
  <rect x="290" y="150" width="200" height="110" rx="14" fill="white" filter="drop-shadow(0 4px 16px rgba(26,60,110,0.13))"/>
  <text x="310" y="175" font-size="12" font-weight="600" fill="#1a3c6e">Applications</text>
  <circle cx="320" cy="215" r="28" fill="none" stroke="#e5e7eb" stroke-width="8"/>
  <circle cx="320" cy="215" r="28" fill="none" stroke="#1a3c6e" stroke-width="8"
    stroke-dasharray="105 70" stroke-dashoffset="17" stroke-linecap="round"/>
  <text x="320" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3c6e">6</text>
  <rect x="360" y="198" width="100" height="9" rx="4" fill="#d4edda"/>
  <text x="365" y="207" font-size="9" fill="#155724" font-weight="600">Accepted ✅</text>
  <rect x="360" y="213" width="80" height="9" rx="4" fill="#fff3cd"/>
  <text x="365" y="222" font-size="9" fill="#856404" font-weight="600">Pending ⏳</text>
  <rect x="360" y="228" width="65" height="9" rx="4" fill="#cce5ff"/>
  <text x="365" y="237" font-size="9" fill="#004085" font-weight="600">Shortlisted ⭐</text>

  <!-- Central graduate figure -->
  <!-- Body -->
  <circle cx="175" cy="230" r="34" fill="#1a3c6e" opacity="0.08"/>
  <circle cx="175" cy="200" r="22" fill="#2a5298"/>
  <!-- Face -->
  <circle cx="175" cy="200" r="18" fill="#f5c5a3"/>
  <circle cx="169" cy="197" r="2.5" fill="#1a3c6e"/>
  <circle cx="181" cy="197" r="2.5" fill="#1a3c6e"/>
  <path d="M170 205 Q175 210 180 205" stroke="#1a3c6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Graduation cap -->
  <rect x="161" y="185" width="28" height="5" rx="2" fill="#1a3c6e"/>
  <polygon points="175,178 163,185 187,185" fill="#1a3c6e"/>
  <line x1="187" y1="185" x2="187" y2="192" stroke="#d4a843" stroke-width="2"/>
  <circle cx="187" cy="193" r="2.5" fill="#d4a843"/>
  <!-- Shoulders / body -->
  <path d="M148 260 Q148 235 175 232 Q202 235 202 260" fill="#2a5298"/>
  <!-- Laptop in arms -->
  <rect x="157" y="248" width="36" height="22" rx="3" fill="#1a3c6e"/>
  <rect x="159" y="250" width="32" height="17" rx="2" fill="#60a5fa"/>
  <rect x="153" y="268" width="44" height="4" rx="2" fill="#374151"/>
  <!-- Screen lines -->
  <rect x="162" y="253" width="20" height="2" rx="1" fill="white" opacity="0.7"/>
  <rect x="162" y="257" width="14" height="2" rx="1" fill="white" opacity="0.5"/>
  <rect x="162" y="261" width="17" height="2" rx="1" fill="white" opacity="0.4"/>

  <!-- Connection dots -->
  <circle cx="205" cy="220" r="4" fill="#d4a843"/>
  <circle cx="220" cy="210" r="3" fill="#d4a843" opacity="0.6"/>
  <circle cx="235" cy="200" r="2" fill="#d4a843" opacity="0.4"/>
  <circle cx="143" cy="215" r="4" fill="#078930"/>
  <circle cx="130" cy="205" r="3" fill="#078930" opacity="0.6"/>

  <!-- Bottom: Notification row -->
  <rect x="30" y="300" width="460" height="55" rx="14" fill="white" filter="drop-shadow(0 2px 8px rgba(26,60,110,0.10))"/>
  <circle cx="56" cy="327" r="14" fill="#e8f0fe"/>
  <text x="56" y="332" text-anchor="middle" font-size="14">🔔</text>
  <rect x="78" y="318" width="130" height="8" rx="4" fill="#1a3c6e" opacity="0.8"/>
  <rect x="78" y="330" width="90" height="6" rx="3" fill="#6b7280" opacity="0.4"/>
  <circle cx="350" cy="327" r="14" fill="#d4edda"/>
  <text x="350" y="332" text-anchor="middle" font-size="14">✅</text>
  <rect x="372" y="318" width="95" height="8" rx="4" fill="#155724" opacity="0.7"/>
  <rect x="372" y="330" width="70" height="6" rx="3" fill="#6b7280" opacity="0.4"/>

  <!-- Decorative dots pattern -->
  <circle cx="490" cy="320" r="3" fill="#1a3c6e" opacity="0.15"/>
  <circle cx="500" cy="310" r="2" fill="#1a3c6e" opacity="0.10"/>
  <circle cx="505" cy="330" r="2" fill="#d4a843" opacity="0.20"/>
  <circle cx="20" cy="140" r="4" fill="#1a3c6e" opacity="0.12"/>
  <circle cx="12" cy="160" r="2.5" fill="#078930" opacity="0.15"/>
</svg>
