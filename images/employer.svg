<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="empBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" rx="18" fill="url(#empBg)"/>

  <!-- ── Left: Employer/Company figure ─────────────────── -->

  <!-- Building -->
  <rect x="50" y="180" width="130" height="110" rx="4" fill="#1a3c6e"/>
  <rect x="54" y="184" width="122" height="102" rx="2" fill="#2a5298"/>

  <!-- Windows grid -->
  <rect x="62"  y="192" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.7"/>
  <rect x="88"  y="192" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.7"/>
  <rect x="114" y="192" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.7"/>
  <rect x="140" y="192" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.5"/>

  <rect x="62"  y="216" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.8"/>
  <rect x="88"  y="216" width="20" height="16" rx="2" fill="#fbbf24" opacity="0.7"/>
  <rect x="114" y="216" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.7"/>
  <rect x="140" y="216" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.6"/>

  <rect x="62"  y="240" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.5"/>
  <rect x="88"  y="240" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.8"/>
  <rect x="114" y="240" width="20" height="16" rx="2" fill="#fbbf24" opacity="0.6"/>
  <rect x="140" y="240" width="20" height="16" rx="2" fill="#60a5fa" opacity="0.7"/>

  <!-- Door -->
  <rect x="100" y="260" width="30" height="30" rx="3" fill="#1a3c6e"/>
  <circle cx="125" cy="276" r="2.5" fill="#d4a843"/>

  <!-- Rooftop sign -->
  <rect x="68" y="165" width="95" height="18" rx="4" fill="white" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.1))"/>
  <text x="115" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3c6e">TECHCORP 🏢</text>

  <!-- Ground -->
  <rect x="40" y="287" width="155" height="6" rx="3" fill="#1a3c6e" opacity="0.15"/>

  <!-- ── Right: ATS / Hiring workflow cards ──────────────── -->

  <!-- Card: Post a Job -->
  <rect x="215" y="16" width="250" height="72" rx="12" fill="white"
        filter="drop-shadow(0 3px 12px rgba(26,60,110,0.12))"/>
  <circle cx="240" cy="52" r="18" fill="#e8f0fe"/>
  <text x="240" y="58" text-anchor="middle" font-size="18">➕</text>
  <text x="267" y="40" font-size="12" font-weight="700" fill="#1a3c6e">Post a Job</text>
  <text x="267" y="53" font-size="10" fill="#6b7280">Set type, salary range,</text>
  <text x="267" y="65" font-size="10" fill="#6b7280">deadline &amp; work mode.</text>

  <!-- Card: ATS Workflow -->
  <rect x="215" y="104" width="250" height="100" rx="12" fill="white"
        filter="drop-shadow(0 3px 12px rgba(26,60,110,0.12))"/>
  <text x="235" y="124" font-size="12" font-weight="700" fill="#1a3c6e">ATS Workflow</text>

  <!-- Status pipeline -->
  <rect x="230" y="132" width="56" height="22" rx="11" fill="#fff3cd"/>
  <text x="258" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#856404">⏳ Pending</text>

  <text x="292" y="146" font-size="14" fill="#9ca3af">→</text>

  <rect x="302" y="132" width="64" height="22" rx="11" fill="#cce5ff"/>
  <text x="334" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#004085">⭐ Shortlist</text>

  <text x="372" y="146" font-size="14" fill="#9ca3af">→</text>

  <rect x="382" y="132" width="64" height="22" rx="11" fill="#d4edda"/>
  <text x="414" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#155724">✅ Accept</text>

  <rect x="302" y="166" width="60" height="20" rx="10" fill="#f8d7da"/>
  <text x="332" y="179" text-anchor="middle" font-size="9" font-weight="600" fill="#721c24">❌ Reject</text>

  <!-- Bulk action note -->
  <text x="235" y="196" font-size="9" fill="#6b7280">Bulk actions supported · Cover letters &amp; CV download</text>

  <!-- Card: Statistics -->
  <rect x="215" y="220" width="250" height="80" rx="12" fill="white"
        filter="drop-shadow(0 3px 12px rgba(26,60,110,0.12))"/>
  <text x="235" y="242" font-size="12" font-weight="700" fill="#1a3c6e">Hiring Analytics</text>

  <!-- Mini bar chart -->
  <rect x="235" y="282" width="14" height="15" rx="3" fill="#1a3c6e" opacity="0.4"/>
  <rect x="253" y="270" width="14" height="27" rx="3" fill="#1a3c6e" opacity="0.6"/>
  <rect x="271" y="260" width="14" height="37" rx="3" fill="#1a3c6e" opacity="0.8"/>
  <rect x="289" y="268" width="14" height="29" rx="3" fill="#1a3c6e" opacity="0.6"/>
  <rect x="307" y="275" width="14" height="22" rx="3" fill="#1a3c6e" opacity="0.5"/>
  <rect x="325" y="263" width="14" height="34" rx="3" fill="#d4a843" opacity="0.85"/>
  <rect x="343" y="271" width="14" height="26" rx="3" fill="#1a3c6e" opacity="0.6"/>

  <text x="375" y="262" font-size="10" fill="#6b7280">14-day</text>
  <text x="375" y="274" font-size="10" fill="#6b7280">application</text>
  <text x="375" y="286" font-size="10" font-weight="600" fill="#1a3c6e">trend</text>

  <!-- Decorative -->
  <circle cx="205" cy="185" r="5" fill="#d4a843" opacity="0.35"/>
  <circle cx="197" cy="172" r="3" fill="#078930" opacity="0.25"/>
  <circle cx="468" cy="16"  r="5" fill="#1a3c6e" opacity="0.12"/>
  <circle cx="460" cy="26"  r="3" fill="#d4a843" opacity="0.18"/>
  <circle cx="22"  cy="155" r="4" fill="#2a5298" opacity="0.10"/>
</svg>
