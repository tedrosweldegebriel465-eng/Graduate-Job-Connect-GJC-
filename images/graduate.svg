<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="gradBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#f0fff4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" rx="18" fill="url(#gradBg)"/>

  <!-- ── Left: Graduate figure ─────────────────────────── -->
  <!-- Shadow circle -->
  <ellipse cx="130" cy="295" rx="55" ry="10" fill="#1a3c6e" opacity="0.07"/>

  <!-- Body -->
  <path d="M90 295 Q90 255 130 250 Q170 255 170 295" fill="#2a5298"/>

  <!-- Head -->
  <circle cx="130" cy="218" r="26" fill="#f5c5a3"/>

  <!-- Graduation cap -->
  <rect x="111" y="196" width="38" height="6" rx="3" fill="#1a3c6e"/>
  <polygon points="130,186 112,196 148,196" fill="#1a3c6e"/>
  <line x1="148" y1="196" x2="148" y2="204" stroke="#d4a843" stroke-width="2.5"/>
  <circle cx="148" cy="206" r="3.5" fill="#d4a843"/>

  <!-- Face details -->
  <circle cx="123" cy="215" r="3" fill="#1a3c6e"/>
  <circle cx="137" cy="215" r="3" fill="#1a3c6e"/>
  <path d="M124 225 Q130 231 136 225" stroke="#1a3c6e" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Diploma scroll in hand -->
  <rect x="96" y="262" width="46" height="28" rx="5" fill="white" stroke="#d4a843" stroke-width="2"/>
  <rect x="100" y="267" width="30" height="3" rx="1.5" fill="#1a3c6e" opacity="0.6"/>
  <rect x="100" y="273" width="22" height="3" rx="1.5" fill="#1a3c6e" opacity="0.4"/>
  <rect x="100" y="279" width="26" height="3" rx="1.5" fill="#1a3c6e" opacity="0.3"/>
  <circle cx="126" cy="276" r="5" fill="#d4a843" opacity="0.7"/>

  <!-- ── Right: Feature cards ──────────────────────────── -->

  <!-- Card: Job Search -->
  <rect x="200" y="20" width="260" height="80" rx="12" fill="white"
        filter="drop-shadow(0 3px 12px rgba(26,60,110,0.12))"/>
  <circle cx="228" cy="60" r="20" fill="#e8f0fe"/>
  <text x="228" y="66" text-anchor="middle" font-size="20">🔍</text>
  <text x="258" y="48" font-size="13" font-weight="700" fill="#1a3c6e">Find Your Dream Job</text>
  <text x="258" y="63" font-size="10" fill="#6b7280">Search by keyword, location,</text>
  <text x="258" y="76" font-size="10" fill="#6b7280">category and experience level</text>

  <!-- Card: Applications -->
  <rect x="200" y="118" width="260" height="80" rx="12" fill="white"
        filter="drop-shadow(0 3px 12px rgba(26,60,110,0.12))"/>
  <circle cx="228" cy="158" r="20" fill="#d4edda"/>
  <text x="228" y="164" text-anchor="middle" font-size="20">📋</text>
  <text x="258" y="146" font-size="13" font-weight="700" fill="#1a3c6e">Track Applications</text>
  <text x="258" y="161" font-size="10" fill="#6b7280">Monitor status in real-time.</text>
  <text x="258" y="174" font-size="10" fill="#6b7280">Withdraw anytime.</text>

  <!-- Status pills inside card -->
  <rect x="258" y="178" width="52" height="14" rx="7" fill="#d4edda"/>
  <text x="284" y="188" text-anchor="middle" font-size="8" font-weight="600" fill="#155724">✅ Accepted</text>
  <rect x="316" y="178" width="56" height="14" rx="7" fill="#fff3cd"/>
  <text x="344" y="188" text-anchor="middle" font-size="8" font-weight="600" fill="#856404">⏳ Pending</text>

  <!-- Card: CV & Profile -->
  <rect x="200" y="216" width="260" height="80" rx="12" fill="white"
        filter="drop-shadow(0 3px 12px rgba(26,60,110,0.12))"/>
  <circle cx="228" cy="256" r="20" fill="#fff3cd"/>
  <text x="228" y="262" text-anchor="middle" font-size="20">📄</text>
  <text x="258" y="244" font-size="13" font-weight="700" fill="#1a3c6e">Profile &amp; CV Upload</text>
  <text x="258" y="259" font-size="10" fill="#6b7280">PDF upload, MIME-validated.</text>
  <!-- Progress bar -->
  <rect x="258" y="267" width="180" height="8" rx="4" fill="#e5e7eb"/>
  <rect x="258" y="267" width="138" height="8" rx="4" fill="#1a3c6e"/>
  <text x="442" y="275" font-size="9" fill="#1a3c6e" font-weight="700" text-anchor="end">76%</text>

  <!-- Decorative elements -->
  <circle cx="185" cy="25"  r="5" fill="#d4a843" opacity="0.4"/>
  <circle cx="175" cy="40"  r="3" fill="#078930" opacity="0.3"/>
  <circle cx="470" cy="305" r="5" fill="#1a3c6e" opacity="0.15"/>
  <circle cx="460" cy="315" r="3" fill="#d4a843" opacity="0.2"/>
  <circle cx="20"  cy="290" r="4" fill="#2a5298" opacity="0.12"/>
</svg>
